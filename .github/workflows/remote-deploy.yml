name: Remote SSH Command
on:
  push:
    branches:
      - main
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Copy project files to remote project directory
        uses: appleboy/scp-action@v1
        with:
            host: 138.199.169.12
            username: root
            key: ${{ secrets.SECRET }}
            source: .
            target: "~/app"

      - name: Build image and run container
        uses: appleboy/ssh-action@v1
        with:
          host: 138.199.169.12
          username: root
          key: ${{ secrets.SECRET }}
          script: |
            cd ~/app
            docker stop react-app-container || true
            docker rmi tuto-docker || true
            docker build -t tuto-docker .
            docker run -d -p 5173:3000 --name react-app-container --restart unless-stopped tuto-docker
name: Remote SSH Command
on:
  push:
    branches:
      - main
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: 138.199.169.12
          username: root
          key: ${{ secrets.SECRET }}
          port: 22
          script: |
            mkdir /app
            ls -al

      - name: Copy files to remote server
        uses: appleboy/scp-action@v0.1.3
        with:
            host: 138.199.169.12
            username: root
            key: ${{ secrets.SECRET }}
            port: 22
            source: .
            target: "/app"

      - name: Build image and run container
        uses: appleboy/ssh-action@v1
        with:
          host: 138.199.169.12
          username: root
          key: ${{ secrets.SECRET }}
          port: 22
          script: |
            cd /app
            docker rmi tuto-docker:latest --force || true
            docker build -t tuto-docker:latest .
            docker run -d -p 5173:3000 tuto-docker:latest